<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Baduk Battle · Story</title>
<link rel="icon" href="favicon.ico">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@700&family=IBM+Plex+Sans+Thai:wght@500;700&display=swap">
<style>
:root {
  --bg: #15333a; --surface: #20474f; --fg: #f3ead8; --muted: #b3c8c5; --line: rgba(243, 234, 216, .14);
  --accent: #e3b06a; --accent-fg: #2a1a0b; --wood: #c8894a; --wood-dark: #5a331a;
  --f-body: "IBM Plex Sans Thai", "Leelawadee UI", "Thonburi", system-ui, sans-serif;
  --f-px: "Pixelify Sans", "Courier New", monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; overflow: hidden; background: var(--bg); color: var(--fg); font-family: var(--f-body);
  -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; }
#view { position: fixed; inset: 0; display: block; touch-action: none; image-rendering: pixelated; }
.bar { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; gap: 8px;
  padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) 10px max(12px, env(safe-area-inset-left));
  background: linear-gradient(#0e272dee, #0e272d00); pointer-events: none; }
.bar > * { pointer-events: auto; }
.btn { font: 700 14px var(--f-body); color: var(--fg); background: #0e272dcc; border: 2px solid var(--wood); padding: 6px 12px;
  box-shadow: 0 3px 0 var(--wood-dark); cursor: pointer; text-decoration: none; line-height: 1.2; }
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--wood-dark); }
.title { flex: 1; text-align: center; font: 700 15px var(--f-px); letter-spacing: 1px; color: var(--accent); text-shadow: 0 2px 0 #000; }
.title small { display: block; font: 500 12px var(--f-body); color: var(--muted); letter-spacing: 0; }
.where { position: fixed; left: 50%; transform: translateX(-50%); top: calc(max(10px, env(safe-area-inset-top)) + 52px);
  font: 700 13px var(--f-body); background: #0e272dcc; border: 1px solid var(--line); padding: 3px 12px; white-space: nowrap; transition: opacity .3s; }
.card { position: fixed; left: 50%; bottom: max(14px, env(safe-area-inset-bottom)); transform: translateX(-50%);
  width: min(440px, calc(100% - 24px)); background: #0e272df2; border: 3px solid var(--wood); box-shadow: 0 5px 0 var(--wood-dark);
  padding: 12px 14px 14px; }
.card .stripe { height: 6px; margin: -12px -14px 10px; }
.card h2 { margin: 0; font-size: 19px; line-height: 1.3; }
.card h2 span { font: 700 12px var(--f-px); color: var(--muted); letter-spacing: 1px; margin-left: 6px; }
.card p { margin: 6px 0 0; font-size: 14px; line-height: 1.55; color: #e4dccb; }
.card .row { display: flex; gap: 8px; margin-top: 12px; align-items: center; }
.card .row .btn { flex: 1; text-align: center; }
.card .btn[disabled] { opacity: .55; cursor: default; }
.tags { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.tags i { font-style: normal; font-size: 12px; border: 1px solid var(--line); padding: 1px 8px; color: var(--muted); }
.hint { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(14px, env(safe-area-inset-bottom));
  font-size: 13px; color: var(--muted); background: #0e272dcc; padding: 4px 12px; white-space: nowrap; transition: opacity .4s; }
#mini { position: fixed; inset: 0; background: #0b1f24f0; display: flex; align-items: center; justify-content: center; padding: 70px 16px 16px; }
#mini canvas { max-width: 100%; max-height: 100%; image-rendering: pixelated; border: 3px solid var(--wood); box-shadow: 0 5px 0 var(--wood-dark); }
[hidden] { display: none !important; }
</style>

<body>
<canvas id="view"></canvas>
<div class="bar">
  <a class="btn" href="./">← กลับ</a>
  <div class="title">STORY MODE<small>เมืองโกะ · บทที่ 1</small></div>
  <button class="btn" id="mapBtn">แผนที่</button>
</div>
<div class="where" id="where">จัตุรัสกลางเมือง</div>
<div class="hint" id="hint">เดินด้วยปุ่มลูกศร / WASD หรือแตะที่พื้น</div>

  <div class="stripe" id="cStripe"></div>

  <div class="tags" id="cTags"></div>
  <div class="row"><button class="btn" id="cEnter" disabled>เข้าสำนัก · เร็วๆ นี้</button><button class="btn" id="cClose">ปิด</button></div>
</div>
<div id="mini" hidden><canvas id="miniC"></canvas></div>
<script>
(() => {
"use strict";
const T = 16, W = 56, H = 44;
// terrain codes
const G = 0, ST = 1, WA = 2, CW = 3, TR = 4, SA = 5, FL = 6, SW = 7, BA = 8, SP = 9, FB = 10, HE = 11, BD = 13, BR = 14, SK = 16;
const SOLID = new Set([WA, CW, TR, SW, BA, HE, BR, SK]);
const ter = Array.from({ length: H }, () => new Array(W).fill(G));
const block = Array.from({ length: H }, () => new Array(W).fill(false));
const set = (x, y, v) => { if (x >= 0 && y >= 0 && x < W && y < H) ter[y][x] = v; };
const rect = (x0, y0, x1, y1, v) => { for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) set(x, y, v); };
const frame = (x0, y0, x1, y1, v) => { for (let x = x0; x <= x1; x++) { set(x, y0, v); set(x, y1, v); } for (let y = y0; y <= y1; y++) { set(x0, y, v); set(x1, y, v); } };
const hash = (x, y) => { let h = (x * 374761393 + y * 668265263) | 0; h = Math.imul(h ^ (h >>> 13), 1274126177); return ((h ^ (h >>> 16)) >>> 0) / 4294967296; };

// ---------- schools ----------
const SCHOOLS = {
  moyo:   { name: "สำนักโมโย่", en: "MOYO", color: "#f0c060",
            desc: "สายสร้างอิทธิพล วางกรอบกว้างใหญ่ทั้งกระดาน ค่อยๆ ขยายพลังให้แข็งแรงและยิ่งใหญ่",
            tags: ["อิทธิพล", "กรอบใหญ่", "ซันเรนเซ"] },
  attack: { name: "สำนักโจมตี", en: "ATTACK", color: "#e2604a",
            desc: "ต่อสู้เก่ง เน้นหมากต่อสู้อย่างรุนแรงและรวดเร็ว ตัด จู่โจม ไล่ฆ่ากลุ่มไม่ให้ตั้งตัว",
            tags: ["ตัด", "ไล่ฆ่า", "เร็วและแรง"] },
  defend: { name: "สำนักป้องกัน", en: "DEFENSE", color: "#7fa6d0",
            desc: "ค่อยๆ เล่น ช้าแต่แข็งแรง ทุกกลุ่มมั่นคง ไม่มีจุดอ่อนให้ใครเจาะเข้ามาได้",
            tags: ["หนักแน่น", "ต่อให้แน่น", "อดทน"] },
  swift:  { name: "สำนักว่องไว", en: "SWIFT", color: "#8fdcc0",
            desc: "หมากพลิ้ว ทิ้งมือบ่อย เล่นให้หมากเบาไม่มีน้ำหนัก พร้อมทิ้งกลุ่มที่ไม่จำเป็นเพื่อชิงจังหวะ",
            tags: ["ทิ้งมือ", "หมากเบา", "ยอมเสียเพื่อได้"] },
};

// ---------- city layout ----------
frame(0, 0, W - 1, H - 1, CW);
rect(1, 21, W - 2, 22, ST);            // east-west avenue
rect(27, 1, 28, H - 2, ST);            // north-south avenue
rect(24, 18, 31, 25, ST);              // central plaza

// NW: Moyo — a huge open hedge garden, stone go-board mosaic, grand hall
frame(3, 2, 23, 17, HE);
rect(13, 17, 14, 20, ST);
rect(13, 8, 14, 16, FL);
rect(9, 10, 17, 14, BD);
for (const [x0, y0] of [[5, 4], [19, 4], [5, 12], [19, 12]]) rect(x0, y0, x0 + 2, y0 + 3, FB);

// NE: Attack — red wooden palisade, sand training yard
frame(32, 2, 52, 17, BR);
rect(33, 3, 51, 16, SA);
rect(41, 17, 42, 20, ST);

// SW: Defense — double stone wall, winding way in
rect(4, 26, 22, 40, FL);
frame(3, 25, 23, 41, SW);
frame(6, 28, 20, 38, SW);
rect(13, 23, 14, 25, ST);              // outer gate (north)
rect(13, 38, 14, 38, FL);              // inner gate (south): walk round between the walls

// SE: Swift — pond, islands, stepping stones, bamboo
rect(32, 25, 52, 41, WA);
rect(41, 23, 42, 24, ST);
const isl = (x0, y0, x1, y1) => rect(x0, y0, x1, y1, G);
isl(38, 31, 45, 36); isl(33, 27, 36, 29); isl(48, 27, 51, 30); isl(33, 37, 37, 40); isl(48, 37, 51, 40);
for (const [x, y] of [[41, 25], [41, 26], [42, 26], [42, 27], [42, 28], [41, 28], [41, 29], [41, 30],
  [37, 29], [37, 30], [37, 31], [46, 33], [47, 33], [47, 32], [47, 31], [48, 31], [38, 37], [39, 37], [45, 37], [46, 37], [47, 37]])
  set(x, y, SP);
for (const [x, y] of [[33, 27], [34, 27], [50, 27], [51, 27], [51, 28], [33, 40], [34, 40], [51, 40], [45, 31], [38, 36], [51, 37]]) set(x, y, BA);

// objects
const objs = [];
const obj = (o) => { objs.push(o); if (o.solid !== false) for (let y = o.y; y < o.y + o.h; y++) for (let x = o.x; x < o.x + o.w; x++) block[y][x] = true; };
obj({ k: "fountain", x: 27, y: 21, w: 2, h: 2 });
const B = [];
const bld = (b) => { B.push(b); obj({ k: "bld", ...b }); };
bld({ id: "moyo", x: 10, y: 4, w: 8, h: 4, style: "hall", roof: "#e9b452", roofD: "#a8722a", roofL: "#f7d58a", wall: "#f3e7cc", door: [13, 8], door2: 14, label: "สำนักโมโย่" });
bld({ id: "attack", x: 38, y: 4, w: 7, h: 4, style: "dojo", roof: "#d6513d", roofD: "#8a2a1c", roofL: "#ee8a6c", wall: "#efdcbc", door: [41, 8], label: "สำนักโจมตี" });
bld({ id: "defend", x: 10, y: 30, w: 7, h: 4, style: "fort", roof: "#5b7ea8", roofD: "#33506f", roofL: "#86a6c9", wall: "#c4c6bd", door: [13, 34], label: "สำนักป้องกัน" });
bld({ id: "swift", x: 40, y: 32, w: 4, h: 3, style: "pav", roof: "#7fcfb2", roofD: "#3f8a70", roofL: "#b6ead7", wall: "#f3ead8", door: [41, 35], label: "สำนักว่องไว" });
bld({ id: "michio", x: 29, y: 26, w: 3, h: 2, style: "hut", roof: "#9a6a44", roofD: "#5a3a22", roofL: "#bf8d62", wall: "#efe3c8", door: [30, 28], label: "บ้านครูมิชิโอะ" });
// school props
for (const [x, y] of [[35, 10], [37, 13], [46, 10], [48, 13], [35, 5], [49, 6]]) obj({ k: "dummy", x, y, w: 1, h: 1 });
obj({ k: "rack", x: 44, y: 12, w: 2, h: 1 });
for (const [x, y] of [[33, 3], [51, 3], [33, 16], [51, 16]]) obj({ k: "banner", x, y, w: 1, h: 1, c: "#e2604a" });
for (const [x, y] of [[11, 9], [16, 9], [11, 15], [16, 15]]) obj({ k: "lantern", x, y, w: 1, h: 1 });
for (const [x, y] of [[3, 25], [22, 25], [3, 40], [22, 40]]) obj({ k: "tower", x, y, w: 2, h: 2 });
for (const [x, y] of [[8, 31], [18, 31], [8, 36], [18, 36]]) obj({ k: "banner", x, y, w: 1, h: 1, c: "#7fa6d0" });
obj({ k: "pavilion", x: 49, y: 28, w: 2, h: 2 }); obj({ k: "pavilion", x: 35, y: 38, w: 2, h: 2 });
for (const [x, y] of [[25, 19], [30, 19], [25, 24]]) obj({ k: "lamp", x, y, w: 1, h: 1 });
for (const [x, y] of [[4, 3], [22, 3]]) obj({ k: "banner", x, y, w: 1, h: 1, c: "#f0c060" });
for (const [x, y] of [[36, 34], [47, 35]]) obj({ k: "lily", x, y, w: 1, h: 1, solid: false });

// zones
const inside = (x, y) => (x >= 3 && x <= 23 && y >= 2 && y <= 17) || (x >= 32 && x <= 52 && y >= 2 && y <= 17) || (x >= 3 && x <= 23 && y >= 25 && y <= 41) || (x >= 32 && x <= 52 && y >= 25 && y <= 41);
const zoneOf = (x, y) => {
  if (x >= 3 && x <= 23 && y >= 2 && y <= 17) return "moyo";
  if (x >= 32 && x <= 52 && y >= 2 && y <= 17) return "attack";
  if (x >= 3 && x <= 23 && y >= 25 && y <= 41) return "defend";
  if (x >= 32 && x <= 52 && y >= 25 && y <= 41) return "swift";
  if (x >= 24 && x <= 31 && y >= 18 && y <= 25) return "plaza";
  return "town";
};
const ZONE_NAME = { moyo: "เขตสำนักโมโย่", attack: "เขตสำนักโจมตี", defend: "เขตสำนักป้องกัน", swift: "เขตสำนักว่องไว", plaza: "จัตุรัสกลางเมือง", town: "เมืองโกะ" };

// trees: groves along the city wall, cherry blossoms by the plaza, open lawns elsewhere
const nearDoor = (x, y) => B.some((b) => Math.abs(b.door[0] - x) <= 1 && Math.abs(b.door[1] - y) <= 1);
const roadDist = (x, y) => { let d = 9; for (let dy = -2; dy <= 2; dy++) for (let dx = -2; dx <= 2; dx++) if (ter[y + dy]?.[x + dx] === ST) d = Math.min(d, Math.max(Math.abs(dx), Math.abs(dy))); return d; };
const grove = (x, y) => Math.sin(x * .55 + 1.3) + Math.sin(y * .6 + x * .2) + Math.sin((x - y) * .33);
for (let y = 1; y < H - 1; y++) for (let x = 1; x < W - 1; x++) {
  if (ter[y][x] !== G || inside(x, y) || block[y][x] || nearDoor(x, y) || roadDist(x, y) < 2) continue;
  const edge = x <= 2 || y <= 1 || x >= W - 3 || y >= H - 2;
  if (edge ? hash(x, y) < .8 : grove(x, y) > 1.1 && hash(x, y) < .75) set(x, y, TR);
}
for (const [x, y] of [[23, 19], [32, 19], [23, 24], [32, 24], [5, 9], [21, 9], [4, 16], [22, 16], [44, 36], [33, 29], [50, 30], [48, 39], [34, 39]]) if (!block[y][x]) set(x, y, SK);
for (const [x, y] of [[24, 17], [31, 17], [24, 26], [26, 27], [25, 30], [30, 31], [25, 35], [30, 36], [25, 40], [30, 40]]) if (ter[y][x] === G && !block[y][x]) set(x, y, SK);

const solidAt = (x, y) => x < 0 || y < 0 || x >= W || y >= H || SOLID.has(ter[y][x]) || block[y][x];

// ---------- painting ----------
const C = {
  g: "#6c9d5a", gD: "#5f8f50", gL: "#7dae67", gS: "#4f7c45",
  p: "#e6cfa0", pD: "#cdb07c", pL: "#f1dfb8",
  w: "#3f88a6", wD: "#336f8c", wL: "#7cc0d4", foam: "#d6eef2", bank: "#8b6a43",
  stone: "#a9aba3", stoneD: "#93958d", stoneL: "#bdbfb7",
  wall: "#8d8a84", wallD: "#6b6863", wallL: "#aaa7a0",
  tree: "#3e7a4a", treeD: "#2e6040", treeL: "#5a9a5c",
  sak: "#f2b6c6", sakD: "#de8ea6", sakL: "#fde0e8",
  sand: "#e8cc94", sandD: "#d6b67c",
  wood: "#6b4026", woodD: "#4a2a18",
};
const isPath = (t) => t === ST || t === FL || t === BD || t === SA;
const isWater = (t) => t === WA || t === SP;
const tAt = (x, y) => (x < 0 || y < 0 || x >= W || y >= H) ? CW : ter[y][x];

function paint(m, phase) {
  const px = (c, x, y, w = 1, h = 1) => { m.fillStyle = c; m.fillRect(x, y, w, h); };
  const grass = (X, Y, x, y) => {
    px(C.g, X, Y, T, T);
    const r = hash(x, y), r2 = hash(y, x);
    px(C.gD, X + (r * 13 | 0), Y + (r2 * 13 | 0), 3, 2);
    if (r > .55) { px(C.gL, X + (r2 * 12 | 0) + 2, Y + (r * 11 | 0) + 3, 1, 2); px(C.gL, X + (r2 * 12 | 0) + 3, Y + (r * 11 | 0) + 2, 1, 2); }
    if (r > .93) { px("#f6f0dc", X + 6, Y + 8, 2, 2); px("#f0c060", X + 6, Y + 8, 1, 1); }
    if (r < .05) { px("#f3a8b8", X + 9, Y + 4, 2, 2); }
  };
  for (let y = 0; y < H; y++) for (let x = 0; x < W; x++) {
    const t = ter[y][x], X = x * T, Y = y * T, r = hash(x, y);
    const up = tAt(x, y - 1), dn = tAt(x, y + 1), lf = tAt(x - 1, y), rt = tAt(x + 1, y);
    switch (t) {
      case G: case TR: case SK: case BA: case FB:
        grass(X, Y, x, y);
        if (isWater(dn)) { px(C.bank, X, Y + 13, T, 3); px(C.gS, X, Y + 12, T, 1); }
        if (t === FB) for (let i = 0; i < 6; i++) { const a = hash(x * 7 + i, y * 3 - i); px(["#f0c060", "#fbf3e0", "#f3a8b8", "#f0c060", "#fbf3e0", "#e27a8f"][i], X + 2 + (i % 3) * 5, Y + 3 + (i / 3 | 0) * 6 + (a * 2 | 0), 2, 2); }
        break;
      case ST: {
        px(C.p, X, Y, T, T);
        if (r < .5) px(C.pD, X + (r * 25 | 0) % 13 + 1, Y + (r * 77 | 0) % 13 + 1, 2, 1);
        if (r > .8) px(C.pL, X + (r * 41 | 0) % 12 + 2, Y + (r * 13 | 0) % 12 + 2, 2, 1);
        const e = (n) => !isPath(n) && !isWater(n);
        if (e(up)) { px(C.pD, X, Y, T, 1); px(C.g, X, Y, T, 1); px(C.gD, X + 3, Y + 1, 2, 1); }
        if (e(dn)) { px(C.pD, X, Y + 15, T, 1); }
        if (e(lf)) { px(C.pD, X, Y, 1, T); }
        if (e(rt)) { px(C.pD, X + 15, Y, 1, T); }
        if (e(up) && e(lf)) px(C.g, X, Y, 2, 2);
        if (e(up) && e(rt)) px(C.g, X + 14, Y, 2, 2);
        if (e(dn) && e(lf)) px(C.g, X, Y + 14, 2, 2);
        if (e(dn) && e(rt)) px(C.g, X + 14, Y + 14, 2, 2);
        break; }
      case WA: case SP: {
        px(C.w, X, Y, T, T);
        if (r > .6) px(C.wD, X + (r * 9 | 0), Y + 9, 6, 2);
        const o = (phase * 3 + x * 5 + y * 3) % 12; px(C.wL, X + o, Y + 5, 3, 1); if (phase) px(C.wL, X + ((o + 6) % 12), Y + 11, 2, 1);
        if (!isWater(up)) { px(C.wD, X, Y, T, 3); px(C.foam, X, Y + 3, T, 1); }
        if (!isWater(lf)) px(C.foam, X, Y, 1, T);
        if (!isWater(rt)) px(C.foam, X + 15, Y, 1, T);
        if (!isWater(dn)) px(C.foam, X, Y + 15, T, 1);
        if (t === SP) { px(C.wD, X + 3, Y + 7, 10, 6); px(C.stone, X + 3, Y + 4, 10, 8); px(C.stoneL, X + 4, Y + 4, 6, 2); px(C.stoneD, X + 3, Y + 11, 10, 1); }
        break; }
      case CW:
        px(C.wall, X, Y, T, T); px(C.wallL, X, Y, T, 4); px(C.wallD, X, Y + 15, T, 1);
        px(C.wallD, X, Y + 9, T, 1); px(C.wallD, X + ((x + y) & 1 ? 4 : 11), Y + 4, 1, 5); px(C.wallD, X + ((x + y) & 1 ? 11 : 4), Y + 10, 1, 5);
        if (y === 0 || y === H - 1) { px(C.wallL, X + 1, Y - 0, 5, 2); px(C.wallL, X + 9, Y, 5, 2); }
        break;
      case SA:
        px(C.sand, X, Y, T, T); if (r < .6) px(C.sandD, X + (r * 97 | 0) % 13 + 1, Y + (r * 57 | 0) % 13 + 1, 2, 1);
        if (tAt(x, y - 1) === BR) px(C.sandD, X, Y, T, 2);
        break;
      case FL:
        px(C.stone, X, Y, T, T); px(C.stoneD, X, Y + 15, T, 1); px(C.stoneD, X + 15, Y, 1, T); px(C.stoneL, X, Y, 15, 1);
        if (r < .15) px(C.stoneD, X + 4, Y + 6, 4, 1);
        if (tAt(x, y - 1) === SW) px("#00000022", X, Y, T, 3);
        break;
      case SW:
        px(C.wall, X, Y, T, T); px(C.wallL, X, Y, T, 5); px(C.wallD, X, Y + 14, T, 2);

  const k = miniC.width / (W * T);
  c.textAlign = "center"; c.textBaseline = "middle"; c.font = `700 ${Math.round(17 * k)}px "IBM Plex Sans Thai", sans-serif`;
  for (const id of Object.keys(SCHOOLS)) { const b = B.find((b) => b.id === id); const cx = (b.x + b.w / 2) * T * k, cy = (b.y - .9) * T * k;
    const tw = c.measureText(SCHOOLS[id].name).width + 14; c.fillStyle = "#0e272de6"; c.fillRect(cx - tw / 2, cy - 13 * k, tw, 26 * k);
    c.fillStyle = SCHOOLS[id].color; c.fillText(SCHOOLS[id].name, cx, cy); }
  c.fillStyle = "#ff5a3c"; c.beginPath(); c.arc((P.x + .5) * T * k, (P.y + .5) * T * k, 6 * k, 0, 7); c.fill(); c.strokeStyle = "#fff"; c.lineWidth = 2; c.stroke();
  mini.hidden = false;
}
document.getElementById("mapBtn").onclick = toggleMini;
mini.addEventListener("pointerdown", () => (mini.hidden = true));

// test hook: ?at=x,y places the hero (used for screenshots)
const at = new URLSearchParams(location.search).get("at");
if (at) { const [ax, ay] = at.split(",").map(Number); if (!solidAt(ax, ay)) { P.x = P.fx = ax; P.y = P.fy = ay; } }
window.__story = { P, B, toggleMini, bfs };
document.fonts?.ready.then(() => frameDraw());
requestAnimationFrame(tick);
})();
</script>
