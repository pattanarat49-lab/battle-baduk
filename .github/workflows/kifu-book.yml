# Builds an opening book from a player's game records (src/tools/kifu_book.py) and commits only the book JSON.
# The records come from Andries Brouwer's public game collection; they are not stored in the repository.
name: Build kifu opening book
on:
  push:
    branches: [claude/project-thread-s2uaqo]
    paths: [.github/workflows/kifu-book.yml, src/tools/kifu_book.py]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  book:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and build
        run: |
          set -e
          mkdir -p kifu nets
          curl -fSL -o seigen.tgz https://homepages.cwi.nl/~aeb/go/games/go_seigen.tgz
          tar -xzf seigen.tgz -C kifu
          find kifu -name '*.sgf' | wc -l
          grep -rhoa 'P[BW]\[[^]]*\]' kifu | sort | uniq -c | sort -rn | head -5
          python3 src/tools/kifu_book.py kifu seigen-book.json "go seigen,wu qingyuan,go sei-gen,wu ch'ing-yuan,wu qing yuan" | tee nets/seigen-book.txt
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add seigen-book.json nets/seigen-book.txt
          git commit -m "Build Go Seigen opening book from his game records" || exit 0
          git pull --rebase origin ${GITHUB_REF_NAME} && git push origin HEAD:${GITHUB_REF_NAME}
