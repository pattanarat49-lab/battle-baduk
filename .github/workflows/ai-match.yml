# AI test matches: every pair of the chosen characters plays one game (or two, swapping colours) in headless Chromium,
# all pairs at once. Each game is shown live on the stats page (/stats, "AI ทดสอบ") and its result lands in the table
# there; this run's summary lists the results too. Runners have no GPU, so the networks run on WebAssembly and read far
# fewer positions per move than on a player's device with a graphics card.
name: AI test matches
on:
  workflow_dispatch:
    inputs:
      players: { description: "character ids, comma separated", default: "sai,takemiya,changho,seigen,todo" }
      both_colors: { description: "play each pair twice, swapping colours", type: boolean, default: false }
jobs:
  pairs:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.p.outputs.matrix }}
    steps:
      - id: p
        env: { PLAYERS: "${{ inputs.players }}", BOTH: "${{ inputs.both_colors }}" }
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import itertools, json, os, random
          ps = [p.strip() for p in os.environ["PLAYERS"].split(",") if p.strip()]
          games = []
          for a, b in itertools.combinations(ps, 2):
              if os.environ["BOTH"] == "true": games += [{"b": a, "w": b}, {"b": b, "w": a}]
              else: games.append(random.choice([{"b": a, "w": b}, {"b": b, "w": a}]))
          print("matrix=" + json.dumps({"include": games}))
          PY
  play:
    needs: pairs
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix: ${{ fromJson(needs.pairs.outputs.matrix) }}
    name: ${{ matrix.b }} (black) vs ${{ matrix.w }} (white)
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: npm i --no-save playwright@1.48.2 && npx playwright install --with-deps chromium
      - run: python3 -m http.server 8000 >/dev/null 2>&1 &
      - run: node src/tools/ai_match.js ${{ matrix.b }} ${{ matrix.w }} http://localhost:8000 result.json
      - uses: actions/upload-artifact@v4
        with: { name: "result-${{ matrix.b }}-${{ matrix.w }}", path: result.json }
  summary:
    needs: play
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: results }
      - run: |
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import glob, json
          print("| black | white | winner | how | margin | moves |\n|---|---|---|---|---|---|")
          for f in sorted(glob.glob("results/*/result.json")):
              r = json.load(open(f))
              win = r["black"] if r["winner"] == "b" else r["white"]
              m = ("~" if r.get("estimated") else "") + str(r["margin"])
              print(f"| {r['black']} | {r['white']} | {win} | {r['how']} | {m} | {r['moves']} |")
          PY
