# Fetches a few extra public game records (by id) into kifu-extra/ for the KIFU library; src/tools/kifu_build.py reads that folder too.
name: Fetch extra kifu
on:
  push:
    branches: [claude/project-thread-f3ty2h]
    paths: [.github/workflows/kifu-extra.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p kifu-extra
          for id in 18951391 19455545 20203824 20408053; do
            curl -fsSL -A "kifu-fetch" "https://online-go.com/api/v1/games/$id/sgf" -o "kifu-extra/ogs-$id.sgf" || echo "failed $id"
            curl -fsSL -A "kifu-fetch" "https://online-go.com/api/v1/games/$id" -o "kifu-extra/ogs-$id.json" || true
            sleep 2
          done
          curl -sSL -A "Mozilla/5.0" "https://kpmc.kbaduk.or.kr/us/gibo" -o kifu-extra/kpmc-list.html || true
          ls -la kifu-extra
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add kifu-extra
          git commit -m "Extra kifu fetched" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
