# Fetches a few extra public game records (by id) into kifu-extra/ for the KIFU library; src/tools/kifu_build.py reads that folder too.
name: Fetch extra kifu
on:
  push:
    branches: [claude/project-thread-f3ty2h]
    paths: [.github/workflows/kifu-extra.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          mkdir -p kifu-extra/kpmc
          for p in $(seq 1 102); do
            curl -sSL -m 30 -A "Mozilla/5.0 (kifu library)" "https://kpmc.kbaduk.or.kr/us/gibo?page=$p" -o "kifu-extra/kpmc/list-$p.html" || echo "failed $p"
            sleep 0.5
          done
          curl -sSL -m 30 -A "Mozilla/5.0 (kifu library)" "https://kpmc.kbaduk.or.kr/us/gibo/1666" -o kifu-extra/kpmc/game-1666.html || true
          rm -f kifu-extra/kpmc-list.html
          grep -li "Karuehawanit\|Wichrich" kifu-extra/kpmc/*.html || true
          ls -la kifu-extra
          git config user.name "github-actions[bot]"
          git config user.email "41898+github-actions[bot]@users.noreply.github.com"
          git add kifu-extra
          git commit -m "Extra kifu fetched" || exit 0
          git push origin HEAD:${GITHUB_REF_NAME}
